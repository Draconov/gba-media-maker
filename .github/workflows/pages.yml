name: Deploy web converter to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "website/**"
      - "assets/player_stub.bin"
      - "player/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install LLVM player build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm

      - name: Build and sync GBA player
        run: |
          bash player/build.sh
          node website/scripts/sync-player.mjs

      - name: Install website dependencies
        working-directory: website
        run: npm install --no-audit --no-fund

      - name: Test browser ROM builder
        working-directory: website
        run: npm test

      - name: Build static website
        working-directory: website
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: website/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
