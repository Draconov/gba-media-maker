name: Release

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Publish release {0}', inputs.version)
      || 'Publish release from VERSION' }}

on:
  # Every push to main publishes or updates the normal release named in VERSION.
  push:
    branches:
      - main

  # A stable release can also be published manually from Actions > Release.
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, for example v0.11.0"
        required: true
        type: string

permissions:
  contents: write

# Do not let two pushes publish the same release simultaneously.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "::error::These Go files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Choose release version
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$MANUAL_VERSION"
            [[ "$tag" == v* ]] || tag="v$tag"
          else
            base_version="$(tr -d '[:space:]' < VERSION)"
            if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::VERSION must contain a version such as 0.11.0"
              exit 1
            fi
            tag="v${base_version}"
          fi

          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like v0.11.0"
            exit 1
          fi

          version="${tag#v}"
          title="GBA Video Maker ${tag}"
          folder="GBA_Video_Maker_v${version}_Portable"
          zip_file="${folder}.zip"

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "folder=$folder" >> "$GITHUB_OUTPUT"
          echo "zip_file=$zip_file" >> "$GITHUB_OUTPUT"

      - name: Build Windows executable
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          rm -f "GBA Video Maker.exe"
          go build -trimpath \
            -buildvcs=false \
            -ldflags="-H windowsgui -s -w" \
            -o "GBA Video Maker.exe" .

      - name: Embed application icon
        run: >-
          go run ./tools/embedicon
          -exe "GBA Video Maker.exe"
          -ico "assets/app_icon.ico"

      - name: Fetch pinned FFmpeg for the portable package
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p _vendor
          python -m pip download \
            --only-binary=:all: \
            --no-deps \
            --platform win_amd64 \
            --implementation py \
            --python-version 3 \
            --abi none \
            --dest _vendor \
            shaka-streamer-binaries==1.5.1

          wheel="$(find _vendor -maxdepth 1 -name 'shaka_streamer_binaries-1.5.1-*-win_amd64.whl' -print -quit)"
          if [[ -z "$wheel" ]]; then
            echo "::error::The pinned Windows wheel was not downloaded."
            exit 1
          fi

          echo "240b5a649527f1ddd8b95e7856a0e830c5da02664be5d45032654d274ead7a8c  $wheel" | sha256sum -c -

          # Do not assume where the wheel stores FFmpeg or what its internal
          # filename is. Find the Windows PE binary by its MZ header and copy
          # it to the portable package under the name the app expects.
          WHEEL="$wheel" python - <<'PY'
          import os
          import pathlib
          import zipfile

          wheel = pathlib.Path(os.environ["WHEEL"])
          output = pathlib.Path("ffmpeg.exe")

          with zipfile.ZipFile(wheel) as archive:
              names = sorted(
                  archive.namelist(),
                  key=lambda name: (
                      pathlib.PurePosixPath(name).name.lower() not in {"ffmpeg", "ffmpeg.exe"},
                      len(name),
                      name,
                  ),
              )
              for name in names:
                  base = pathlib.PurePosixPath(name).name.lower()
                  if "ffmpeg" not in base or name.endswith("/"):
                      continue
                  data = archive.read(name)
                  if data.startswith(b"MZ"):
                      output.write_bytes(data)
                      print(f"Extracted {name} -> {output}")
                      break
              else:
                  raise SystemExit("No Windows FFmpeg PE executable was found in the verified wheel")

          if output.stat().st_size < 1_000_000:
              raise SystemExit("Extracted FFmpeg executable is unexpectedly small")
          PY

          test -s ffmpeg.exe
          python - <<'PY'
          from pathlib import Path
          data = Path("ffmpeg.exe").read_bytes()[:2]
          if data != b"MZ":
              raise SystemExit("ffmpeg.exe is not a Windows PE executable")
          PY

      - name: Package portable ZIP
        shell: bash
        env:
          FOLDER: ${{ steps.release.outputs.folder }}
          ZIP_FILE: ${{ steps.release.outputs.zip_file }}
        run: |
          set -euo pipefail
          mkdir "$FOLDER"
          cp "GBA Video Maker.exe" ffmpeg.exe README.md LICENSE THIRD_PARTY_NOTICES.md "$FOLDER/"
          zip -9 -r "$ZIP_FILE" "$FOLDER"
          sha256sum "$ZIP_FILE" > "${ZIP_FILE}.sha256"

      - name: Publish normal GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          ZIP_FILE: ${{ steps.release.outputs.zip_file }}
        run: |
          set -euo pipefail

          # A push to main updates the one normal release for the VERSION value.
          # This avoids build-number tags and avoids creating prereleases.
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --tags --force
            git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG" --force

            gh release upload "$RELEASE_TAG" \
              "$ZIP_FILE" \
              "${ZIP_FILE}.sha256" \
              --clobber

            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --prerelease=false \
              --latest
          else
            gh release create "$RELEASE_TAG" \
              "$ZIP_FILE" \
              "${ZIP_FILE}.sha256" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --generate-notes \
              --latest
          fi
