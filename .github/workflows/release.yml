name: Release

run-name: >-
  ${{ github.event_name == 'workflow_dispatch'
      && format('Publish release {0}', inputs.version)
      || 'Publish release from VERSION' }}

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      version:
        description: "Version tag, for example v0.13.0"
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Install LLVM player build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y clang lld llvm

      - name: Build GBA player
        run: bash player/build.sh

      - name: Check formatting
        shell: bash
        run: |
          unformatted="$(gofmt -l .)"
          if [[ -n "$unformatted" ]]; then
            echo "::error::These Go files are not formatted:"
            echo "$unformatted"
            exit 1
          fi

      - name: Vet
        run: go vet ./...

      - name: Test
        run: go test ./...

      - name: Choose release version
        id: release
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          MANUAL_VERSION: ${{ inputs.version }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            tag="$MANUAL_VERSION"
            [[ "$tag" == v* ]] || tag="v$tag"
          else
            base_version="$(tr -d '[:space:]' < VERSION)"
            if [[ ! "$base_version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "::error::VERSION must contain a version such as 0.13.0"
              exit 1
            fi
            tag="v${base_version}"
          fi
          if [[ ! "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::Version must look like v0.13.0"
            exit 1
          fi

          version="${tag#v}"
          title="GBA Media Maker ${tag}"
          folder="GBA_Media_Maker_v${version}_Portable"
          zip_file="${folder}.zip"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "title=$title" >> "$GITHUB_OUTPUT"
          echo "folder=$folder" >> "$GITHUB_OUTPUT"
          echo "zip_file=$zip_file" >> "$GITHUB_OUTPUT"

      - name: Build Windows executable
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          rm -f "GBA Media Maker.exe"
          go build -trimpath \
            -buildvcs=false \
            -ldflags="-H windowsgui -s -w" \
            -o "GBA Media Maker.exe" .

      - name: Embed application icon
        run: >-
          go run ./tools/embedicon
          -exe "GBA Media Maker.exe"
          -ico "assets/icon.ico"

      - name: Fetch pinned FFmpeg for the portable package
        shell: bash
        run: |
          set -euo pipefail
          FFMPEG_TAG="autobuild-2026-08-07-13-13"
          FFMPEG_BASE="https://github.com/BtbN/FFmpeg-Builds/releases/download/${FFMPEG_TAG}"

          mkdir -p _vendor/ffmpeg
          curl --fail --location --retry 3 --retry-delay 2 \
            "${FFMPEG_BASE}/checksums.sha256" \
            --output _vendor/checksums.sha256
          archive_entry="$(grep -E '^[0-9a-fA-F]{64}[[:space:]]+\*?ffmpeg-[^[:space:]]+-win64-lgpl\.zip$' \
            _vendor/checksums.sha256 | head -n 1 || true)"
          if [[ -z "${archive_entry}" ]]; then
            echo "::error::Could not find the non-shared win64 LGPL FFmpeg ZIP in the pinned release."
            echo "Available win64 LGPL entries:"
            grep -E 'win64.*lgpl.*\.zip$' _vendor/checksums.sha256 || true
            exit 1
          fi
          expected="$(printf '%s\n' "${archive_entry}" | awk '{print $1}')"
          FFMPEG_ARCHIVE="$(printf '%s\n' "${archive_entry}" | \
            sed -E 's/^[0-9a-fA-F]{64}[[:space:]]+\*?//')"
          if [[ ! "${expected}" =~ ^[0-9a-fA-F]{64}$ || -z "${FFMPEG_ARCHIVE}" ]]; then
            echo "::error::Invalid FFmpeg entry in the pinned release checksum list."
            exit 1
          fi
          echo "Using pinned FFmpeg asset: ${FFMPEG_ARCHIVE}"
          curl --fail --location --retry 3 --retry-delay 2 \
            "${FFMPEG_BASE}/${FFMPEG_ARCHIVE}" \
            --output "_vendor/${FFMPEG_ARCHIVE}"

          echo "${expected}  _vendor/${FFMPEG_ARCHIVE}" | sha256sum -c -
          unzip -q "_vendor/${FFMPEG_ARCHIVE}" -d _vendor/ffmpeg
          candidate="$(find _vendor/ffmpeg -type f -path '*/bin/ffmpeg.exe' -print -quit)"
          if [[ -z "${candidate}" ]]; then
            echo "::error::No ffmpeg.exe was found in the pinned archive."
            exit 1
          fi
          cp "${candidate}" ffmpeg.exe

          python - <<'PY'
          from pathlib import Path
          path = Path("ffmpeg.exe")
          data = path.read_bytes()
          if data[:2] != b"MZ":
              raise SystemExit("ffmpeg.exe is not a Windows PE executable")
          if len(data) < 1_000_000:
              raise SystemExit("Extracted FFmpeg executable is unexpectedly small")
          if b"--enable-libdav1d" not in data and b"--enable-libaom" not in data:
              raise SystemExit("Pinned FFmpeg build has no verified software AV1 decoder")
          print(f"Verified software-AV1-capable FFmpeg: {len(data)} bytes")
          PY

      - name: Package portable ZIP
        shell: bash
        env:
          FOLDER: ${{ steps.release.outputs.folder }}
          ZIP_FILE: ${{ steps.release.outputs.zip_file }}
        run: |
          set -euo pipefail
          mkdir "$FOLDER"
          cp "GBA Media Maker.exe" ffmpeg.exe README.md LICENSE THIRD_PARTY_NOTICES.md "$FOLDER/"
          zip -9 -r "$ZIP_FILE" "$FOLDER"
          sha256sum "$ZIP_FILE" > "${ZIP_FILE}.sha256"

      - name: Publish normal GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
          RELEASE_TITLE: ${{ steps.release.outputs.title }}
          ZIP_FILE: ${{ steps.release.outputs.zip_file }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --tags --force
            git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG" --force

            gh release upload "$RELEASE_TAG" \
              "$ZIP_FILE" \
              "${ZIP_FILE}.sha256" \
              --clobber
            gh release edit "$RELEASE_TAG" \
              --title "$RELEASE_TITLE" \
              --prerelease=false \
              --latest
          else
            gh release create "$RELEASE_TAG" \
              "$ZIP_FILE" \
              "${ZIP_FILE}.sha256" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --generate-notes \
              --latest
          fi
