name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Test
        run: go test ./...

      - name: Build Windows executable
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-H windowsgui -s -w" -o "GBA Video Maker.exe" .

      - name: Package portable release
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          folder="GBA_Video_Maker_v${version}_Portable"
          mkdir "$folder"
          cp "GBA Video Maker.exe" README.md LICENSE THIRD_PARTY_NOTICES.md "$folder/"
          zip -9 -r "${folder}.zip" "$folder"
          sha256sum "${folder}.zip" > "${folder}.zip.sha256"

      - name: Publish GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            GBA_Video_Maker_v*_Portable.zip \
            GBA_Video_Maker_v*_Portable.zip.sha256 \
            --generate-notes \
            --title "GBA Video Maker $GITHUB_REF_NAME"
