name: Release

run-name: Publish release from VERSION

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  actions: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.release.outputs.version }}
      tag: ${{ steps.release.outputs.tag }}
      title: ${{ steps.release.outputs.title }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install validation tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg clang lld llvm

      - name: Build GBA player
        run: bash player/build.sh

      - name: Check formatting
        shell: bash
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test Go application
        run: go test ./...

      - name: Test and build browser edition
        working-directory: website
        run: |
          npm install --no-audit --no-fund
          npm test
          npm run build

      - name: Read release version
        id: release
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::VERSION must contain a semantic version such as 1.2.3"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=v$version" >> "$GITHUB_OUTPUT"
          echo "title=GBA Media Maker v$version" >> "$GITHUB_OUTPUT"

  windows:
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build Windows executable
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          go build -trimpath -buildvcs=false -ldflags="-H windowsgui -s -w" -o "GBA Media Maker.exe" .
          go run ./tools/embedicon -exe "GBA Media Maker.exe" -ico "assets/icon.ico"

      - name: Fetch pinned LGPL FFmpeg
        run: ./scripts/fetch-ffmpeg-btbn.sh windows amd64 ffmpeg.exe

      - name: Package Windows x64 release
        shell: bash
        env:
          VERSION: ${{ needs.validate.outputs.version }}
        run: |
          set -euo pipefail
          folder="GBA_Media_Maker_v${VERSION}_Windows_x64"
          archive="${folder}.zip"
          mkdir "$folder"
          cp "GBA Media Maker.exe" ffmpeg.exe README.md README.uk.md LICENSE THIRD_PARTY_NOTICES.md "$folder/"
          zip -9 -r "$archive" "$folder"
          sha256sum "$archive" | awk '{print $1}' > "$archive.sha256"

      - name: Upload Windows release files
        uses: actions/upload-artifact@v7
        with:
          name: release-windows-x64
          path: |
            GBA_Media_Maker_v${{ needs.validate.outputs.version }}_Windows_x64.zip
            GBA_Media_Maker_v${{ needs.validate.outputs.version }}_Windows_x64.zip.sha256
          if-no-files-found: error

  linux:
    needs: validate
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Fetch pinned LGPL FFmpeg
        run: ./scripts/fetch-ffmpeg-btbn.sh linux amd64 "$RUNNER_TEMP/ffmpeg"

      - name: Build Linux x86_64 release
        env:
          FFMPEG_BIN: ${{ runner.temp }}/ffmpeg
        run: ./scripts/build-linux-slice.sh amd64 "$RUNNER_TEMP/linux-amd64"

      - name: Package Linux x86_64 release
        run: |
          chmod +x "$RUNNER_TEMP/linux-amd64/gba-media-maker" "$RUNNER_TEMP/linux-amd64/ffmpeg"
          ./scripts/package-linux.sh "$RUNNER_TEMP/linux-amd64"

      - name: Smoke-test Linux x86_64 package
        run: |
          folder="dist/GBA_Media_Maker_v${{ needs.validate.outputs.version }}_Linux_x86_64"
          "$folder/gba-media-maker" --help >/dev/null
          "$folder/ffmpeg" -hide_banner -decoders 2>&1 | grep -Eq 'libdav1d|libaom-av1'
          test -x "$folder/install-user.sh"

      - name: Upload Linux release files
        uses: actions/upload-artifact@v7
        with:
          name: release-linux-x86-64
          path: |
            dist/GBA_Media_Maker_v${{ needs.validate.outputs.version }}_Linux_x86_64.tar.gz
            dist/GBA_Media_Maker_v${{ needs.validate.outputs.version }}_Linux_x86_64.tar.gz.sha256
          if-no-files-found: error

  macos-slices:
    needs: validate
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: macos-15-intel
          - arch: arm64
            runner: macos-15
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Build pinned LGPL-compatible FFmpeg
        run: ./scripts/build-ffmpeg-macos.sh "$RUNNER_TEMP/ffmpeg-macos"

      - name: Build macOS native slice
        env:
          FFMPEG_DIR: ${{ runner.temp }}/ffmpeg-macos
        run: ./scripts/build-macos-slice.sh ${{ matrix.arch }} "$RUNNER_TEMP/macos-slice"

      - name: Smoke-test native macOS slice
        run: |
          "$RUNNER_TEMP/macos-slice/GBA Media Maker" --help >/dev/null
          "$RUNNER_TEMP/macos-slice/ffmpeg" -hide_banner -decoders 2>&1 | grep -q libdav1d

      - name: Upload macOS slice
        uses: actions/upload-artifact@v7
        with:
          name: macos-slice-${{ matrix.arch }}
          path: ${{ runner.temp }}/macos-slice
          if-no-files-found: error

  macos:
    needs: [validate, macos-slices]
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v6

      - name: Download macOS Intel slice
        uses: actions/download-artifact@v8
        with:
          name: macos-slice-amd64
          path: ${{ runner.temp }}/macos-amd64

      - name: Download macOS Apple Silicon slice
        uses: actions/download-artifact@v8
        with:
          name: macos-slice-arm64
          path: ${{ runner.temp }}/macos-arm64

      - name: Package Universal 2 macOS app
        run: |
          chmod +x "$RUNNER_TEMP/macos-amd64/GBA Media Maker" "$RUNNER_TEMP/macos-amd64/ffmpeg"
          chmod +x "$RUNNER_TEMP/macos-arm64/GBA Media Maker" "$RUNNER_TEMP/macos-arm64/ffmpeg"
          ./scripts/package-macos.sh "$RUNNER_TEMP/macos-amd64" "$RUNNER_TEMP/macos-arm64"

      - name: Verify Universal 2 macOS bundle
        shell: bash
        run: |
          set -euo pipefail
          app="dist/GBA Media Maker.app"
          lipo -archs "$app/Contents/MacOS/GBA Media Maker" | grep -qw x86_64
          lipo -archs "$app/Contents/MacOS/GBA Media Maker" | grep -qw arm64
          lipo -archs "$app/Contents/MacOS/ffmpeg" | grep -qw x86_64
          lipo -archs "$app/Contents/MacOS/ffmpeg" | grep -qw arm64
          codesign --verify --deep --strict "$app"
          "$app/Contents/MacOS/GBA Media Maker" --help >/dev/null
          "$app/Contents/MacOS/ffmpeg" -hide_banner -decoders 2>&1 | grep -q libdav1d

      - name: Upload macOS release files
        uses: actions/upload-artifact@v7
        with:
          name: release-macos
          path: |
            dist/GBA_Media_Maker_v${{ needs.validate.outputs.version }}_macOS.zip
            dist/GBA_Media_Maker_v${{ needs.validate.outputs.version }}_macOS.zip.sha256
          if-no-files-found: error

  publish:
    needs: [validate, windows, linux, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Download release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir release-assets
          gh run download "$GITHUB_RUN_ID" --dir release-assets
          find release-assets -maxdepth 2 -type f -print
          find release-assets -mindepth 2 -maxdepth 2 -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.sha256' \) -exec cp {} release-assets/ \;

      - name: Publish GitHub release
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_TITLE: ${{ needs.validate.outputs.title }}
        run: |
          set -euo pipefail
          mapfile -t files < <(find release-assets -maxdepth 1 -type f \( -name '*.zip' -o -name '*.tar.gz' -o -name '*.sha256' \) -print | sort)
          if [[ ${#files[@]} -ne 6 ]]; then
            echo "::error::Expected three release archives plus three checksums, found ${#files[@]} files."
            printf '%s\n' "${files[@]}"
            exit 1
          fi

          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            git fetch --tags --force
            git tag -f "$RELEASE_TAG" "$GITHUB_SHA"
            git push origin "refs/tags/$RELEASE_TAG" --force
            gh release upload "$RELEASE_TAG" "${files[@]}" --clobber
            gh release edit "$RELEASE_TAG" --title "$RELEASE_TITLE" --prerelease=false --latest
          else
            gh release create "$RELEASE_TAG" "${files[@]}" \
              --target "$GITHUB_SHA" \
              --title "$RELEASE_TITLE" \
              --generate-notes \
              --latest
          fi
