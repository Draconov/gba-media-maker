name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Install FFmpeg and GBA player build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg clang lld llvm

      - name: Verify committed GBA player stub
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/player_stub.bin
          test "$(stat -c%s assets/player_stub.bin)" -eq 32768

          expected="$(tr -d '[:space:]' < player/stub-source.sha256)"
          actual="$(sha256sum \
            player/startup.S \
            player/metadata.S \
            player/compiler_compat.S \
            player/main.c \
            player/linker.ld \
            player/build.sh | sha256sum | awk '{print $1}')"
          if [[ "$actual" != "$expected" ]]; then
            echo "::error::GBA player source changed without refreshing player/stub-source.sha256 and assets/player_stub.bin."
            echo "Expected source fingerprint: $expected"
            echo "Actual source fingerprint:   $actual"
            exit 1
          fi

      - name: Verify website player sync
        shell: bash
        run: |
          set -euo pipefail
          rm -f website/public/player_stub.bin
          node website/scripts/sync-player.mjs
          test -f website/public/player_stub.bin
          test "$(stat -c%s website/public/player_stub.bin)" -eq 32768
          cmp assets/player_stub.bin website/public/player_stub.bin

      - name: Rebuild GBA player smoke test
        shell: bash
        env:
          PLAYER_STUB_OUT: ${{ runner.temp }}/player_stub.bin
        run: |
          set -euo pipefail
          bash player/build.sh
          test -f "$PLAYER_STUB_OUT"
          test "$(stat -c%s "$PLAYER_STUB_OUT")" -eq 32768

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Build Windows portable executable
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          rm -f "GBA Media Maker.exe"
          go build -trimpath -buildvcs=false -ldflags="-H windowsgui -s -w" -o "GBA Media Maker.exe" .

      - name: Embed application icon
        run: go run ./tools/embedicon -exe "GBA Media Maker.exe" -ico "assets/app_icon.ico"

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: gba-media-maker-windows-amd64
          path: GBA Media Maker.exe
          if-no-files-found: error
