name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install FFmpeg and GBA player build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg clang lld llvm

      - name: Verify committed GBA player stub
        shell: bash
        run: |
          set -euo pipefail
          test -f assets/player_stub.bin
          test "$(stat -c%s assets/player_stub.bin)" -eq 32768

      - name: Verify website player sync
        shell: bash
        run: |
          set -euo pipefail
          rm -f website/public/player_stub.bin
          node website/scripts/sync-player.mjs
          test -f website/public/player_stub.bin
          test "$(stat -c%s website/public/player_stub.bin)" -eq 32768
          cmp assets/player_stub.bin website/public/player_stub.bin

      - name: Rebuild GBA player smoke test
        shell: bash
        env:
          PLAYER_STUB_OUT: ${{ runner.temp }}/player_stub.bin
        run: |
          set -euo pipefail
          bash player/build.sh
          test -f "$PLAYER_STUB_OUT"
          test "$(stat -c%s "$PLAYER_STUB_OUT")" -eq 32768

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Install website dependencies
        working-directory: website
        run: npm install --no-audit --no-fund

      - name: Test browser edition
        working-directory: website
        run: npm test

      - name: Build browser edition
        working-directory: website
        run: npm run build

      - name: Check release shell scripts
        shell: bash
        run: bash -n scripts/*.sh

      - name: Build Windows desktop executable
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          rm -f "GBA Media Maker.exe"
          go build -trimpath -buildvcs=false -ldflags="-H windowsgui -s -w" -o "GBA Media Maker.exe" .

      - name: Embed application icon
        run: go run ./tools/embedicon -exe "GBA Media Maker.exe" -ico "assets/icon.ico"

      - name: Cross-build macOS and Linux desktop binaries
        shell: bash
        run: |
          set -euo pipefail
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/gbamm-darwin-amd64" .
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/gbamm-darwin-arm64" .
          GOOS=linux GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -buildvcs=false -o "$RUNNER_TEMP/gbamm-linux-amd64" .

      - name: Dry-run Linux x86_64 package layout
        shell: bash
        run: |
          set -euo pipefail
          amd="$RUNNER_TEMP/linux-slice-amd64"
          mkdir -p "$amd"
          cp "$RUNNER_TEMP/gbamm-linux-amd64" "$amd/gba-media-maker"
          cp "$RUNNER_TEMP/gbamm-linux-amd64" "$amd/ffmpeg"
          chmod +x "$amd"/*
          ./scripts/package-linux.sh "$amd"
          archive="dist/GBA_Media_Maker_v$(cat VERSION)_Linux_x86_64.tar.gz"
          test -f "$archive"
          tar -tzf "$archive" | grep -q '/gba-media-maker$'
          tar -tzf "$archive" | grep -q '/ffmpeg$'
          ! tar -tzf "$archive" | grep -q '/bin/arm64/'

      - name: Verify Universal 2 macOS packager is wired
        shell: bash
        run: |
          grep -q 'lipo -create' scripts/package-macos.sh
          grep -q '_macOS.zip' scripts/package-macos.sh
          ! grep -q '_macOS_Intel' scripts/package-macos.sh
          ! grep -q '_macOS_AppleSilicon' scripts/package-macos.sh

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: gba-media-maker-windows-amd64
          path: GBA Media Maker.exe
          if-no-files-found: error
