name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install FFmpeg for integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Build Windows portable executable
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: go build -trimpath -ldflags="-H windowsgui -s -w" -o "GBA Video Maker.exe" .

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: gba-video-maker-windows-amd64
          path: GBA Video Maker.exe
          if-no-files-found: error
