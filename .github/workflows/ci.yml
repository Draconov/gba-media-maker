name: CI

on:
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: false

      - name: Install FFmpeg for integration tests
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Check formatting
        run: test -z "$(gofmt -l .)"

      - name: Vet
        run: go vet ./...

      - name: Test with race detector
        run: go test -race ./...

      - name: Build Windows portable executable
        env:
          GOOS: windows
          GOARCH: amd64
          CGO_ENABLED: 0
        run: |
          rm -f "GBA Video Maker.exe"
          go build -trimpath -buildvcs=false -ldflags="-H windowsgui -s -w" -o "GBA Video Maker.exe" .

      - name: Embed application icon
        run: go run ./tools/embedicon -exe "GBA Video Maker.exe" -ico "assets/app_icon.ico"

      - name: Upload Windows build
        uses: actions/upload-artifact@v7
        with:
          name: gba-video-maker-windows-amd64
          path: GBA Video Maker.exe
          if-no-files-found: error
